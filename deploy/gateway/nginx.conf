worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 4m;
    limit_req_zone $binary_remote_addr zone=drop_page:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=drop_upload:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=drop_connections:10m;

    server {
        listen 8080;
        server_name _;

        set_real_ip_from 172.16.0.0/12;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'" always;
        add_header Cache-Control "no-store" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ "^/(?:[a-z]{4}|d/(?:[a-z]{4}|[a-f0-9]{64}))/?$" {
            limit_except GET HEAD POST { deny all; }
            limit_req zone=drop_page burst=15 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://app:80;
        }

        location = /api/folder/uploadToSharedFolder.php {
            limit_except POST { deny all; }
            limit_req zone=drop_upload burst=90 nodelay;
            limit_conn drop_connections 6;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://app:80;
        }

        location = /api/folder/finishSharedDrop.php {
            limit_except POST { deny all; }
            limit_req zone=drop_page burst=10 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://app:80;
        }

        location = /api/folder/sharedDropUploadStatus.php {
            limit_except GET HEAD { deny all; }
            limit_req zone=drop_upload burst=90 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://app:80;
        }

        location = /api/public/siteConfig.php {
            limit_except GET HEAD { deny all; }
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://app:80;
        }

        location ~ ^/(?:css/(?:share\.css|vendor/roboto\.css)|js/(?:sharedDropView\.js|shareBranding\.js|i18n\.js|i18n/locales/[A-Za-z-]+\.js)|assets/(?:logo\.svg|logo\.png|favicon\.ico)|fonts/roboto/[A-Za-z0-9_-]+\.woff2)$ {
            limit_except GET HEAD { deny all; }
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://app:80;
        }

        location / {
            return 404;
        }
    }
}
